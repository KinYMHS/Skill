<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="依分類探索 Codex Skill、查詢使用時機、複製範例及維護條目。">
  <title>Skill 查詢手冊</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap top-inner">
      <a class="brand" href="/" aria-label="Skill 查詢手冊首頁"><span class="brand-mark" aria-hidden="true">✳</span><span>Skill 查詢手冊</span></a>
      <nav class="top-actions" aria-label="網站導覽">
        <a class="source-link" href="https://docs.google.com/document/d/1ohvIgjskHzKhE2vVwtNO-Cl0OhkIGbub2EK8ySwAeEk/edit" target="_blank" rel="noopener">原始說明</a>
        <button id="manage" class="button outline" type="button" aria-pressed="false"><span class="symbol" aria-hidden="true">✎</span><span>管理條目</span></button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="main-title">
      <div class="hero-content">
        <p class="kicker"><span aria-hidden="true"></span> CODEX SKILL LIBRARY</p>
        <h1 id="main-title">找到適合的 Skill</h1>
        <p class="intro">從用途找到工具，複製範例就能開始。</p>
        <div class="searchbox">
          <span class="glass" aria-hidden="true"></span>
          <label for="query" class="sr-only">搜尋名稱、用途或範例</label>
          <input id="query" type="search" placeholder="搜尋 Skill、用途或範例，例如 PDF" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div>
        <div class="terminal">
          <div class="terminal-bar"><i></i><i></i><i></i></div>
          <div class="terminal-command"><span>❯</span> skill<span class="cursor"></span></div>
          <div class="terminal-lines"><i></i><i></i><i></i></div>
        </div>
        <span class="star star-one">✦</span><span class="star star-two">✧</span><span class="star star-three">+</span>
        <span class="art-grid"></span>
      </div>
    </section>
    <div class="catalog">
      <aside aria-label="瀏覽分類">
        <h2 class="sidebar-label">依用途瀏覽</h2>
        <div id="categories" class="category-list"></div>
      </aside>
      <section class="results" aria-labelledby="results-title">
        <div class="results-head">
          <div>
            <h2 id="results-title">所有 Skill</h2>
            <p id="count" aria-live="polite">正在載入條目…</p>
          </div>
          <button id="add" class="button primary" type="button" hidden>＋ 新增 Skill</button>
        </div>
        <div id="load-error" class="notice" hidden></div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty" hidden>
          <h3>找不到符合的 Skill</h3>
          <p>試試其他關鍵字，或清除搜尋並查看所有分類。</p>
          <button id="reset" class="button outline" type="button">清除篩選</button>
        </div>
        <nav id="pages" class="pages" aria-label="搜尋結果頁碼" hidden></nav>
      </section>
    </div>
  </main>
  <footer class="wrap footer"><span>Skill 查詢手冊</span><span>內容源自《SKILL說明》</span></footer>
  <dialog id="editor">
    <form id="editor-form">
      <div class="dialog-head">
        <h2 id="dialog-title">新增 Skill</h2>
        <button class="button icon" id="close" type="button" aria-label="關閉">×</button>
      </div>
      <p class="form-note">儲存後會直接更新這個網站的目錄。</p>
      <label for="name">Skill 名稱</label>
      <input id="name" name="name" required maxlength="64" pattern="[a-z0-9]+(?:\x2D[a-z0-9]+)*" placeholder="例如 my-skill">
      <p class="hint" id="name-hint">請用小寫英文字母、數字和連字號。</p>
      <label for="category">分類</label>
      <select id="category" name="category" required></select>
      <label for="usage">用途</label>
      <textarea id="usage" name="usage" required maxlength="2000" rows="3" placeholder="說明什麼時候適合使用"></textarea>
      <label for="example">使用範例</label>
      <textarea id="example" name="example" required maxlength="2000" rows="3" placeholder="輸入可直接複製的指令"></textarea>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="form-actions">
        <button class="button outline" id="cancel" type="button">取消</button>
        <button class="button primary" id="save" type="submit">儲存條目</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
